<nav class="bg-white shadow-lg border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo Sport Center -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center">
          <!-- ✅ AGREGAR CLASES CSS AL LOGO -->
          <img src="/assets/images/logo_sportcenter.png" alt="SportCenter" class="h-10 w-auto">
        </a>
      </div>

      <!-- Navigation Links -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/products" 
           routerLinkActive="text-[#0367A6]" 
           class="text-[#666666] hover:text-[#0367A6] px-3 py-2 rounded-md text-sm font-medium transition-colors">
          Productos
        </a>
        <a routerLink="/ofertas" 
           routerLinkActive="text-[#0367A6]" 
           class="text-[#666666] hover:text-[#0367A6] px-3 py-2 rounded-md text-sm font-medium transition-colors">
          Ofertas
        </a>
        <a routerLink="/cart" 
           routerLinkActive="text-[#0367A6]" 
           class="text-[#666666] hover:text-[#0367A6] px-3 py-2 rounded-md text-sm font-medium transition-colors relative">
          <span class="material-symbols-outlined font-variation-settings-wght-400">shopping_cart</span>
          <span class="absolute -top-1 -right-1 bg-[#FF7A00] text-[#202020] text-xs rounded-full h-5 w-5 flex items-center justify-center font-medium">3</span>
        </a>
      </div>

      <!-- Search Bar -->
      <div class="hidden lg:flex flex-1 max-w-md mx-8">
        <div class="relative w-full">
          <input 
            type="text" 
            placeholder="Buscar productos deportivos..."
            class="w-full pl-10 pr-4 py-2 border border-[#A6A6A6] rounded-lg focus:ring-2 focus:ring-[#0367A6] focus:border-[#0367A6] outline-none transition-colors">
          <span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-[#A6A6A6] font-variation-settings-wght-400">search</span>
        </div>
      </div>

      <!-- Auth Buttons -->
      <div class="flex items-center space-x-4">
        <ng-container *ngIf="authService.isLoggedIn()">
          <a [routerLink]="getDashboardLink()" 
             class="text-[#666666] hover:text-[#0367A6] px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined font-variation-settings-wght-400">account_circle</span>
            <span>{{ authService.currentUser()?.nombre }}</span>
          </a>
          <button (click)="logout()"
             class="bg-[#FF7A00] hover:bg-[#E66D00] text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined font-variation-settings-wght-400 text-base">logout</span>
            Cerrar Sesión
          </button>
        </ng-container>
        <ng-container *ngIf="!authService.isLoggedIn()">
          <a routerLink="/auth/login" 
             class="text-[#666666] hover:text-[#0367A6] px-3 py-2 rounded-md text-sm font-medium transition-colors">
            Iniciar Sesión
          </a>
          <a routerLink="/auth/register" 
             class="bg-[#0367A6] hover:bg-[#035A91] text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
            Registrarse
          </a>
        </ng-container>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button class="text-[#666666] hover:text-[#0367A6]">
          <span class="material-symbols-outlined font-variation-settings-wght-400">menu</span>
        </button>
      </div>
    </div>
  </div>
</nav>
