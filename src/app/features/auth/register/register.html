<div class="min-h-screen bg-gradient-to-br from-[#F2F2F2] via-[#F8F9FA] to-[#E9ECEF] flex">
  <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-[#0367A6] to-[#035A91] p-12 flex-col justify-between relative overflow-hidden">
    <div class="absolute top-0 right-0 w-96 h-96 bg-[#FF7A00] opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-80 h-80 bg-white opacity-5 rounded-full blur-3xl"></div>
    <div class="relative z-10">
      <div class="flex items-center space-x-3 mb-8">
        <div class="bg-white/10 backdrop-blur-sm p-3 rounded-xl">
          <span class="material-symbols-outlined text-white text-4xl font-variation-settings-wght-400">storefront</span>
        </div>
        <span class="text-4xl font-bold text-white">Sport Center</span>
      </div>
      <h1 class="text-5xl font-bold text-white leading-tight mb-6">Únete a la<br/>Comunidad<br/>Deportiva</h1>
      <p class="text-xl text-white/80 leading-relaxed max-w-md">Descubre productos deportivos de calidad y ofertas exclusivas.</p>
    </div>
    <div class="relative z-10 space-y-4">
      <div class="flex items-center space-x-3 text-white/90">
        <div class="bg-white/10 backdrop-blur-sm p-2 rounded-lg">
          <span class="material-symbols-outlined text-xl font-variation-settings-wght-400">verified</span>
        </div>
        <span class="text-sm">Productos 100% auténticos</span>
      </div>
    </div>
  </div>
  <div class="flex-1 flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md">
      <div class="lg:hidden flex justify-center items-center space-x-2 mb-8">
        <span class="material-symbols-outlined text-[#0367A6] text-3xl font-variation-settings-wght-400">storefront</span>
        <span class="text-2xl font-bold text-[#202020]">Sport Center</span>
      </div>
      <div class="mb-8">
        <h2 class="text-4xl font-bold text-[#202020] mb-3">Crear Cuenta</h2>
        <p class="text-[#666666] text-lg">Comienza tu experiencia deportiva</p>
      </div>
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-8 max-h-[600px] overflow-y-auto">
        <form class="space-y-4" (ngSubmit)="onSubmit()" #registerForm="ngForm">
          <div class="group">
            <label for="nombre" class="block text-sm font-semibold text-[#202020] mb-2">Nombre</label>
            <input id="nombre" name="nombre" type="text" [(ngModel)]="userData.nombre" required class="w-full px-4 py-3 bg-[#F8F9FA] border-2 border-transparent rounded-xl focus:bg-white focus:border-[#0367A6] focus:ring-4 focus:ring-[#0367A6]/10 outline-none transition-all duration-200 text-[#202020]" placeholder="Juan">
          </div>
          <div class="group">
            <label for="aPaterno" class="block text-sm font-semibold text-[#202020] mb-2">Apellido Paterno</label>
            <input id="aPaterno" name="aPaterno" type="text" [(ngModel)]="userData.aPaterno" required class="w-full px-4 py-3 bg-[#F8F9FA] border-2 border-transparent rounded-xl focus:bg-white focus:border-[#0367A6] focus:ring-4 focus:ring-[#0367A6]/10 outline-none transition-all duration-200 text-[#202020]" placeholder="Pérez">
          </div>
          <div class="group">
            <label for="aMaterno" class="block text-sm font-semibold text-[#202020] mb-2">Apellido Materno</label>
            <input id="aMaterno" name="aMaterno" type="text" [(ngModel)]="userData.aMaterno" required class="w-full px-4 py-3 bg-[#F8F9FA] border-2 border-transparent rounded-xl focus:bg-white focus:border-[#0367A6] focus:ring-4 focus:ring-[#0367A6]/10 outline-none transition-all duration-200 text-[#202020]" placeholder="García">
          </div>
          <div class="group">
            <label for="email" class="block text-sm font-semibold text-[#202020] mb-2">Correo Electrónico</label>
            <input id="email" name="email" type="email" [(ngModel)]="userData.email" required class="w-full px-4 py-3 bg-[#F8F9FA] border-2 border-transparent rounded-xl focus:bg-white focus:border-[#0367A6] focus:ring-4 focus:ring-[#0367A6]/10 outline-none transition-all duration-200 text-[#202020]" placeholder="tu@email.com">
          </div>
          <div class="group">
            <label for="telefono" class="block text-sm font-semibold text-[#202020] mb-2">Teléfono</label>
            <input id="telefono" name="telefono" type="tel" [(ngModel)]="userData.telefono" required class="w-full px-4 py-3 bg-[#F8F9FA] border-2 border-transparent rounded-xl focus:bg-white focus:border-[#0367A6] focus:ring-4 focus:ring-[#0367A6]/10 outline-none transition-all duration-200 text-[#202020]" placeholder="5512345678">
          </div>
          <div class="group">
            <label for="password" class="block text-sm font-semibold text-[#202020] mb-2">Contraseña</label>
            <div class="relative">
              <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="userData.passw" required minlength="6" class="w-full pl-4 pr-12 py-3 bg-[#F8F9FA] border-2 border-transparent rounded-xl focus:bg-white focus:border-[#0367A6] focus:ring-4 focus:ring-[#0367A6]/10 outline-none transition-all duration-200 text-[#202020]" placeholder="Mínimo 6 caracteres">
              <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-[#A6A6A6] hover:text-[#0367A6]">
                <span class="material-symbols-outlined text-xl font-variation-settings-wght-400">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>
          <div class="group">
            <label for="confirmPassword" class="block text-sm font-semibold text-[#202020] mb-2">Confirmar Contraseña</label>
            <div class="relative">
              <input id="confirmPassword" name="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" required class="w-full pl-4 pr-12 py-3 bg-[#F8F9FA] border-2 border-transparent rounded-xl focus:bg-white focus:border-[#0367A6] focus:ring-4 focus:ring-[#0367A6]/10 outline-none transition-all duration-200 text-[#202020]" placeholder="Confirma tu contraseña">
              <button type="button" (click)="toggleConfirmPassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-[#A6A6A6] hover:text-[#0367A6]">
                <span class="material-symbols-outlined text-xl font-variation-settings-wght-400">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>
          <div class="flex items-start pt-2">
            <input id="terms" name="terms" type="checkbox" [(ngModel)]="acceptTerms" required class="h-5 w-5 text-[#0367A6] focus:ring-2 focus:ring-[#0367A6] border-[#A6A6A6] rounded mt-1">
            <label for="terms" class="ml-3 block text-sm text-[#666666]">Acepto los Términos y Condiciones</label>
          </div>
          <button type="submit" [disabled]="isLoading || !registerForm.form.valid || !acceptTerms" class="w-full bg-gradient-to-r from-[#0367A6] to-[#035A91] hover:from-[#035A91] hover:to-[#024A7A] disabled:from-[#A6A6A6] disabled:to-[#A6A6A6] text-white py-3 px-6 rounded-xl font-semibold text-base transition-all duration-200 inline-flex items-center justify-center gap-3 shadow-lg hover:shadow-xl disabled:shadow-none transform hover:-translate-y-0.5 disabled:transform-none">
            <span *ngIf="isLoading" class="animate-spin material-symbols-outlined text-xl font-variation-settings-wght-400">progress_activity</span>
            <span class="material-symbols-outlined text-xl font-variation-settings-wght-400" *ngIf="!isLoading">person_add</span>
            <span>{{ isLoading ? 'Creando Cuenta...' : 'Crear Cuenta' }}</span>
          </button>
        </form>
      </div>
      <div class="text-center mt-6">
        <p class="text-[#666666]">¿Ya tienes cuenta? <a routerLink="/auth/login" class="text-[#0367A6] hover:text-[#035A91] font-semibold ml-1 underline decoration-2 underline-offset-2">Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>
</div>
